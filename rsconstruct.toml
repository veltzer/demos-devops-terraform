# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises", "examples", "to_intergrate/exercises"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["exercises"]

[processor.shellcheck]
src_dirs = ["exercises", "config", "examples", "scripts-teaching", "to_intergrate"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_dirs = ["scripts-teaching/tests"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_dirs = ["examples/packer-experiment", "exercises/basic", "scripts-teaching/org-idea"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["examples/experiment-01-intermediate"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_dirs = ["scripts-teaching/org-idea"]
args = ["-c", ".eslint.config.js"]
