# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[processor.generator.tera]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["exercises", "examples", "to_intergrate/exercises"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["exercises"]

[processor.checker.ishellcheck]
src_dirs = ["exercises", "config", "examples", "scripts-teaching", "to_intergrate"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_dirs = ["scripts-teaching/tests"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["examples/packer-experiment", "exercises/basic", "scripts-teaching/org-idea"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["examples/experiment-01-intermediate"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["scripts-teaching/org-idea"]
args = ["-c", ".oxlintrc.json"]
